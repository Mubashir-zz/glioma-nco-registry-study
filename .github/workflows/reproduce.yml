name: reproduce analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::logistf
            any::ggplot2
            any::dplyr
            any::tidyr
            any::patchwork
            any::pROC

      - name: Keep a copy of the committed outputs
        run: cp -R revised_outputs /tmp/committed_outputs

      - name: Re-run the analysis
        run: Rscript gbm_analysis_revised.R

      # The point of this job. If a code or data change moves any estimate, the
      # regenerated tables stop matching what is committed and the build fails,
      # rather than the repository quietly publishing different numbers than the
      # manuscript reports. See ci/compare_outputs.py for why the comparison is
      # to a tolerance of 1e-8 rather than byte-for-byte.
      - name: Check every table reproduces
        run: python ci/compare_outputs.py /tmp/committed_outputs/tables revised_outputs/tables
